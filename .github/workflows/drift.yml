name: drift

# Two things must never happen silently: something private landing in a
# tracked file, and the generated documentation drifting from its sources.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Nothing private, no stale documentation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: No tracked file carries a secret, a machine path or a taste block
        # Only the published repository is scanned. The private one holds
        # machine-specific documents on purpose - the tools handover names this
        # machine - and what must not be published is the bundle, which the
        # release workflow scans before it ships.
        if: github.repository == 'thebetterfarhan/self-healing-coding-workflow'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/leak-scan.ps1 -Repo .

      - name: The generated documentation matches its sources
        shell: pwsh
        run: |
          cd tools\docgen
          npm ci --silent
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with $LASTEXITCODE" }
          cd ../..
          node tools/docgen/convert-docs.mjs
          if ($LASTEXITCODE -ne 0) { throw "the converter failed with $LASTEXITCODE" }
          # The comparison is on the content, not on the line endings: a
          # checkout on Windows and a checkout on Linux hold the same pages
          # with different endings, and that is not a difference. git diff is
          # the comparison that knows that. A page that is new and not
          # tracked yet is a difference too, and git diff cannot see it.
          $diff = git diff --exit-code -- html
          if ($LASTEXITCODE -ne 0) { $diff | Write-Host; throw 'the committed HTML differs from a fresh regeneration - run tools/docgen/convert-docs.mjs' }
          $untracked = git ls-files --others --exclude-standard -- html
          if ($untracked) { $untracked | Write-Host; throw 'a generated page is not tracked - add it to the repository' }
